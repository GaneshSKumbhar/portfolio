<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificates & Awards — Ganesh Kumbhar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23b820e6'/><stop offset='100%25' style='stop-color:%23da7d20'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='72' font-family='Georgia' font-size='62' font-weight='bold' fill='white' text-anchor='middle'>G</text></svg>" />
  <style>
  :root {
    --bg:#faf9f7; --bg2:#f3f1ee; --bg3:#ede9e4;
    --surface:#ffffff;
    --border:rgba(0,0,0,0.08);
    --border2:rgba(0,0,0,0.15);
    --text:#1a1714; --text2:#6b6560; --text3:#b0a99f;
    --accent:#b820e6; --accent2:#da7d20;
    --accent-soft:rgba(184,32,230,0.08);
    --accent-glow:rgba(184,32,230,0.18);
    --grad:linear-gradient(135deg,#b820e6,#da7d20);
    --grad-text:linear-gradient(135deg,#b820e6 30%,#da7d20);
    --shadow-sm:0 2px 12px rgba(0,0,0,0.06);
    --shadow-md:0 8px 32px rgba(0,0,0,0.10);
    --shadow-lg:0 24px 60px rgba(0,0,0,0.13);
    --radius:14px; --radius-lg:22px; --radius-xl:32px;
    --ease:cubic-bezier(.4,0,.2,1); --t:0.28s;
  }
  [data-theme="dark"] {
    --bg:#0e0c0a; --bg2:#141210; --bg3:#1c1916;
    --surface:#1e1b17;
    --border:rgba(255,255,255,0.07);
    --border2:rgba(255,255,255,0.14);
    --text:#f0ece6; --text2:#9a9089; --text3:#4a4540;
    --accent:#d44aff; --accent2:#ff8c30;
    --accent-soft:rgba(212,74,255,0.10);
    --accent-glow:rgba(212,74,255,0.22);
    --grad:linear-gradient(135deg,#d44aff,#ff8c30);
    --grad-text:linear-gradient(135deg,#d44aff 30%,#ff8c30);
    --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
    --shadow-md:0 8px 32px rgba(0,0,0,0.4);
    --shadow-lg:0 24px 60px rgba(0,0,0,0.55);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
  ::selection{background:var(--accent-soft);color:var(--accent)}
  .container{max-width:1200px;margin:0 auto;padding:0 28px}
  .grad-text{background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  /* NAV */
  .nav{
    position:fixed;top:0;inset-inline:0;z-index:999;
    padding:18px 40px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(16px);
    transition:all var(--t) var(--ease);
  }
  .nav-logo{font-family:'Instrument Serif',serif;font-size:1.4rem;font-style:italic;color:var(--text)}
  .nav-logo span{background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back-btn{
    display:flex;align-items:center;gap:7px;
    padding:9px 20px;border-radius:50px;
    border:1.5px solid var(--border2);
    font-size:0.85rem;color:var(--text);
    transition:all var(--t) var(--ease);
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-2px)}
  .theme-btn{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--border2);background:var(--bg2);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;transition:all var(--t) var(--ease);color:var(--text2);
  }
  .theme-btn:hover{border-color:var(--accent);transform:rotate(20deg)}
  /* PAGE HERO */
  .page-hero{
    padding:140px 0 72px;
    background:var(--bg2);
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  .page-hero::before{
    content:'';position:absolute;top:-200px;right:-100px;
    width:500px;height:500px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-glow),transparent 70%);
    pointer-events:none;
  }
  .page-hero-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;
    color:var(--accent);letter-spacing:0.18em;text-transform:uppercase;
    margin-bottom:16px;
  }
  .page-hero-tag::before{content:'';display:inline-block;width:24px;height:1px;background:var(--accent)}
  .page-hero h1{
    font-family:'Instrument Serif',serif;
    font-size:clamp(2.4rem,5vw,4rem);
    font-weight:400;line-height:1.05;letter-spacing:-0.02em;
    margin-bottom:16px;
  }
  .page-hero p{color:var(--text2);font-size:1rem;max-width:500px;margin-bottom:32px}
  .cert-stats{display:flex;gap:32px;flex-wrap:wrap}
  .cert-stat{text-align:center}
  .cert-stat-n{
    font-family:'Instrument Serif',serif;font-size:2.4rem;
    background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    display:block;line-height:1;
  }
  .cert-stat-l{font-size:0.75rem;color:var(--text2);font-family:'JetBrains Mono',monospace;letter-spacing:0.06em}
  /* TOOLBAR */
  .toolbar{
    position:sticky;top:57px;z-index:100;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:16px 0;
    backdrop-filter:blur(12px);
  }
  .toolbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .filter-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .ftab{
    padding:8px 20px;border-radius:50px;
    border:1.5px solid var(--border);background:var(--surface);
    font-size:0.82rem;font-family:'JetBrains Mono',monospace;
    color:var(--text2);transition:all var(--t) var(--ease);
  }
  .ftab.active,.ftab:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .search-wrap{position:relative}
  .search-input{
    padding:9px 16px 9px 38px;
    border:1.5px solid var(--border);border-radius:50px;
    background:var(--surface);color:var(--text);
    font-family:'DM Sans',sans-serif;font-size:0.85rem;
    width:220px;outline:none;
    transition:all var(--t) var(--ease);
  }
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);width:260px}
  .search-input::placeholder{color:var(--text3)}
  .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:0.9rem;pointer-events:none;color:var(--text3)}
  .count-label{font-size:0.8rem;color:var(--text2);font-family:'JetBrains Mono',monospace;white-space:nowrap}
  /* GALLERY */
  .gallery-section{padding:48px 0 100px}
  .cert-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:24px;
  }
  .cert-group-label{
    grid-column:1/-1;
    display:flex;align-items:center;gap:12px;
    padding:8px 0 4px;
    font-family:'JetBrains Mono',monospace;font-size:0.75rem;
    color:var(--text2);letter-spacing:0.12em;text-transform:uppercase;
  }
  .cert-group-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .cert-tile{
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;cursor:pointer;
    transition:all var(--t) var(--ease);
    position:relative;
  }
  .cert-tile:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
  .cert-thumb{
    width:100%;aspect-ratio:4/3;
    background:var(--bg3);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .cert-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform 0.4s var(--ease);
  }
  .cert-tile:hover .cert-thumb img{transform:scale(1.06)}
  .thumb-pdf{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(135deg,var(--bg3),var(--bg2));
  }
  .thumb-pdf-icon{
    width:68px;height:68px;border-radius:18px;
    background:var(--accent-soft);border:1.5px solid rgba(184,32,230,0.22);
    display:flex;align-items:center;justify-content:center;font-size:2rem;
  }
  .thumb-pdf span{font-size:0.72rem;color:var(--text2);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em}
  .thumb-placeholder{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .thumb-placeholder .ph-emoji{font-size:2.8rem;opacity:.45}
  .thumb-placeholder span{font-size:0.7rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
  .thumb-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.48);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity var(--t) var(--ease);
  }
  .cert-tile:hover .thumb-overlay{opacity:1}
  .view-pill{
    padding:10px 26px;background:#fff;color:#000;
    border-radius:50px;font-size:0.85rem;font-weight:700;
    display:flex;align-items:center;gap:6px;
    transform:translateY(8px);transition:transform var(--t) var(--ease);
  }
  .cert-tile:hover .view-pill{transform:translateY(0)}
  .ribbon{
    position:absolute;top:12px;right:12px;
    padding:3px 11px;border-radius:50px;
    font-size:0.65rem;font-family:'JetBrains Mono',monospace;
    font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
  }
  .ribbon.springboard{background:rgba(239,113,35,.9);color:#fff}
  .ribbon.coursera{background:rgba(0,86,210,.9);color:#fff}
  .ribbon.google{background:rgba(66,133,244,.9);color:#fff}
  .ribbon.hackathon{background:rgba(218,125,32,.88);color:#fff}
  .ribbon.event{background:rgba(22,163,74,.88);color:#fff}
  .ribbon.competition{background:rgba(184,32,230,.88);color:#fff}
  .cert-info{padding:18px 20px 20px;border-top:1px solid var(--border)}
  .cert-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cert-issuer{font-family:'JetBrains Mono',monospace;font-size:0.67rem;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase}
  .cert-date{font-size:0.72rem;color:var(--text2)}
  .cert-name{font-weight:600;font-size:0.92rem;color:var(--text);line-height:1.3}
  .empty-state{
    grid-column:1/-1;text-align:center;
    padding:80px 20px;color:var(--text2);
  }
  .empty-state-icon{font-size:3rem;margin-bottom:16px}
  .empty-state h3{font-family:'Instrument Serif',serif;font-size:1.4rem;margin-bottom:8px;color:var(--text)}
  /* LIGHTBOX */
  .lightbox{
    position:fixed;inset:0;z-index:9000;
    background:rgba(0,0,0,0.93);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    opacity:0;pointer-events:none;
    transition:opacity 0.22s var(--ease);
  }
  .lightbox.open{opacity:1;pointer-events:all}
  .lb-box{
    position:relative;
    max-width:920px;width:100%;max-height:92vh;
    background:var(--surface);border-radius:var(--radius-xl);
    overflow:hidden;display:flex;flex-direction:column;
    transform:scale(0.93);transition:transform 0.26s var(--ease);
    box-shadow:0 40px 100px rgba(0,0,0,0.65);
  }
  .lightbox.open .lb-box{transform:scale(1)}
  .lb-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:22px 24px 14px;flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .lb-issuer-tag{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase}
  .lb-title{font-family:'Instrument Serif',serif;font-size:1.35rem;color:var(--text);margin-top:3px}
  .lb-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .lb-verify{
    display:flex;align-items:center;gap:6px;
    padding:8px 18px;border-radius:50px;
    background:rgba(34,197,94,0.12);color:#16a34a;
    border:1.5px solid rgba(34,197,94,0.3);
    font-size:0.82rem;font-weight:600;
    transition:all var(--t) var(--ease);
  }
  [data-theme="dark"] .lb-verify{color:#4ade80;border-color:rgba(74,222,128,0.3);background:rgba(74,222,128,0.08)}
  .lb-verify:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(34,197,94,0.2)}
  .lb-download{
    display:flex;align-items:center;gap:6px;
    padding:8px 18px;border-radius:50px;
    background:var(--grad);color:#fff;
    font-size:0.82rem;font-weight:600;
    transition:all var(--t) var(--ease);
  }
  .lb-download:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
  .lb-close{
    width:36px;height:36px;border-radius:50%;
    border:1.5px solid var(--border2);background:var(--bg2);
    color:var(--text2);display:flex;align-items:center;justify-content:center;
    font-size:1rem;cursor:pointer;transition:all var(--t) var(--ease);
  }
  .lb-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lb-body{
    flex:1;overflow:auto;
    padding:20px 24px;
    display:flex;align-items:center;justify-content:center;
    min-height:300px;
  }
  .lb-body img{
    max-width:100%;max-height:62vh;
    border-radius:var(--radius);object-fit:contain;
    box-shadow:var(--shadow-md);
  }
  .lb-pdf{width:100%;height:62vh;border:none;border-radius:var(--radius)}
  .lb-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-top:1px solid var(--border);flex-shrink:0;
  }
  .lb-nav-btn{
    display:flex;align-items:center;gap:6px;
    padding:9px 20px;border-radius:50px;
    border:1.5px solid var(--border2);background:var(--surface);
    font-size:0.83rem;color:var(--text2);cursor:pointer;
    transition:all var(--t) var(--ease);
  }
  .lb-nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .lb-nav-btn:disabled{opacity:0.3;cursor:not-allowed}
  .lb-counter{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--text2)}
  /* RESPONSIVE */
  @media(max-width:768px){
    .nav{padding:14px 20px}
    .toolbar-inner{flex-direction:column;align-items:flex-start;gap:12px}
    .search-input{width:100%}
    .search-input:focus{width:100%}
    .cert-gallery{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
    .lb-head{flex-direction:column}
    .lb-head-right{width:100%;justify-content:flex-end}
  }
  @media(max-width:480px){
    .cert-gallery{grid-template-columns:1fr 1fr}
    .cert-stats{gap:20px}
  }
  </style>
</head>
<body>

<!-- NAV -->
<header class="nav">
  <a href="index.html" class="nav-logo"><span>G</span>anesh<span>.</span></a>
  <div class="nav-right">
    <a href="index.html" class="back-btn">← Back to Portfolio</a>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</header>

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="container">
    <div class="page-hero-tag">Achievements</div>
    <h1>Certificates &amp; <span class="grad-text">Awards</span></h1>
    <p>All recognitions from courses, hackathons, competitions and college events — click any to view full size.</p>
    <div class="cert-stats">
      <div class="cert-stat"><span class="cert-stat-n" id="totalCount">0</span><span class="cert-stat-l">Total</span></div>
      <div class="cert-stat"><span class="cert-stat-n" id="sbCount">0</span><span class="cert-stat-l">Springboard</span></div>
      <div class="cert-stat"><span class="cert-stat-n" id="courseraCount">0</span><span class="cert-stat-l">Coursera</span></div>
      <div class="cert-stat"><span class="cert-stat-n" id="googleCount">0</span><span class="cert-stat-l">Google Cloud</span></div>
      <div class="cert-stat"><span class="cert-stat-n" id="hackCount">0</span><span class="cert-stat-l">Hackathons</span></div>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="container">
    <div class="toolbar-inner">
      <div class="filter-tabs" id="filterTabs">
        <button class="ftab active" data-filter="all">All</button>
        <button class="ftab" data-filter="springboard">🟠 Springboard</button>
        <button class="ftab" data-filter="coursera">🔵 Coursera</button>
        <button class="ftab" data-filter="google">🔴 Google Cloud</button>
        <button class="ftab" data-filter="hackathon">⚡ Hackathons</button>
        <button class="ftab" data-filter="event">🎯 Events</button>
        <button class="ftab" data-filter="competition">🏆 Competitions</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search certificates…" />
        </div>
        <span class="count-label" id="countLabel">Showing 0</span>
      </div>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery-section">
  <div class="container">
    <div class="cert-gallery" id="certGallery"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <div class="lb-head">
      <div class="lb-title-wrap">
        <div class="lb-issuer-tag" id="lbIssuer"></div>
        <div class="lb-title" id="lbTitle"></div>
      </div>
      <div class="lb-head-right">
        <a href="#" class="lb-verify" id="lbVerify" target="_blank" rel="noopener" style="display:none">✓ Verify</a>
        <a href="#" class="lb-download" id="lbDownload" download>↓ Download</a>
        <button class="lb-close" id="lbClose">✕</button>
      </div>
    </div>
    <div class="lb-body" id="lbBody"></div>
    <div class="lb-foot">
      <button class="lb-nav-btn" id="lbPrev">← Prev</button>
      <span class="lb-counter" id="lbCounter"></span>
      <button class="lb-nav-btn" id="lbNext">Next →</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   CERTIFICATES DATA
   Add your certificates here. Each entry:
   {
     name:     "Certificate title",
     issuer:   "Who gave it",
     date:     "2024",
     category: "springboard" | "coursera" | "google" | "hackathon" | "event" | "competition",
     file:     "assets/certificates/filename.pdf",
     type:     "image" | "pdf",
     emoji:    "🏆",
     verify:   "https://verify-url" (optional)
   }
════════════════════════════════════════════════════════ */
const CERTIFICATES = [

  // ── INFOSYS SPRINGBOARD ──────────────────────────────
  {
    name:     "Introduction to Hardware & Software",
    issuer:   "Infosys Springboard",
    date:     "Feb 10, 2026",
    category: "springboard",
    file:     "assets/certificates/fb19ee50-abc8-42c9-9aa2-d61047f1b77a.pdf",
    type:     "pdf",
    emoji:    "🔌"
  },
  {
    name:     "Introduction to DobotStudio",
    issuer:   "Infosys Springboard",
    date:     "Feb 10, 2026",
    category: "springboard",
    file:     "assets/certificates/9d2f3bf6-fa56-4d3c-bd09-54dcb688a573.pdf",
    type:     "pdf",
    emoji:    "🤖"
  },
  {
    name:     "Introduction to Line Finder & Ultrasonic Sensor",
    issuer:   "Infosys Springboard",
    date:     "Feb 10, 2026",
    category: "springboard",
    file:     "assets/certificates/01395ba8-1122-4c02-a45e-0b570861742b.pdf",
    type:     "pdf",
    emoji:    "📡"

/* ════════════════════════════════════════════════════════
   THEME
════════════════════════════════════════════════════════ */
const html     = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
setTheme(localStorage.getItem('theme') || 'light');
function setTheme(t) {
  html.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
themeBtn.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ════════════════════════════════════════════════════════
   RENDER
════════════════════════════════════════════════════════ */
const gallery     = document.getElementById('certGallery');
const countLabel  = document.getElementById('countLabel');
const searchInput = document.getElementById('searchInput');

let activeFilter = 'all';
let activeSearch = '';
let visibleCerts = [];
let lbIndex      = 0;

function ribbonClass(cat) {
  return { springboard:'springboard', coursera:'coursera', google:'google', hackathon:'hackathon', event:'event', competition:'competition' }[cat] || 'event';
}
function ribbonLabel(cat) {
  return { springboard:'Springboard', coursera:'Coursera', google:'Google Cloud', hackathon:'Hackathon', event:'Event', competition:'Competition' }[cat] || cat;
}

function makeTile(cert, globalIdx) {
  const div = document.createElement('div');
  div.className = 'cert-tile reveal';
  div.dataset.category = cert.category;

  let thumbInner = '';
  if (cert.type === 'pdf') {
    thumbInner = `<div class="thumb-pdf">
      <div class="thumb-pdf-icon">${cert.emoji}</div>
      <span>PDF Certificate</span>
    </div>`;
  } else {
    thumbInner = `<img src="${cert.file}" alt="${cert.name}"
      onerror="this.parentElement.innerHTML=\`<div class='thumb-placeholder'>
        <span class='ph-emoji'>${cert.emoji}</span>
        <span>Image not found</span>
      </div>\`" />`;
  }

  div.innerHTML = `
    <div class="cert-thumb">
      ${thumbInner}
      <div class="thumb-overlay"><div class="view-pill">👁 View</div></div>
      <span class="ribbon ${ribbonClass(cert.category)}">${ribbonLabel(cert.category)}</span>
    </div>
    <div class="cert-info">
      <div class="cert-meta">
        <span class="cert-issuer">${cert.issuer}</span>
        <span class="cert-date">${cert.date}</span>
      </div>
      <div class="cert-name">${cert.name}</div>
    </div>`;

  div.addEventListener('click', () => openLightbox(globalIdx));
  return div;
}

function render() {
  gallery.innerHTML = '';
  const q = activeSearch.toLowerCase();

  visibleCerts = CERTIFICATES.filter(c => {
    const matchCat    = activeFilter === 'all' || c.category === activeFilter;
    const matchSearch = !q || c.name.toLowerCase().includes(q) || c.issuer.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  if (!visibleCerts.length) {
    gallery.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">🔍</div>
      <h3>No certificates found</h3>
      <p>Try a different filter or search term.</p>
    </div>`;
    countLabel.textContent = 'Showing 0';
    return;
  }

  const showGroups = activeFilter === 'all';
  if (showGroups) {
    const groups = {};
    visibleCerts.forEach(c => { (groups[c.category] = groups[c.category] || []).push(c); });
    const order = ['springboard', 'coursera', 'google', 'hackathon', 'event', 'competition'];
    const names = { springboard:'Infosys Springboard', coursera:'Coursera', google:'Google Cloud', hackathon:'Hackathons', event:'Events', competition:'Competitions' };
    order.forEach(cat => {
      if (!groups[cat]) return;
      const lbl = document.createElement('div');
      lbl.className = 'cert-group-label';
      lbl.textContent = names[cat] || cat;
      gallery.appendChild(lbl);
      groups[cat].forEach(cert => {
        gallery.appendChild(makeTile(cert, CERTIFICATES.indexOf(cert)));
      });
    });
  } else {
    visibleCerts.forEach(cert => {
      gallery.appendChild(makeTile(cert, CERTIFICATES.indexOf(cert)));
    });
  }

  countLabel.textContent = `Showing ${visibleCerts.length}`;
  requestAnimationFrame(() => {
    document.querySelectorAll('.cert-tile.reveal').forEach((el, i) => {
      el.style.transitionDelay = (i % 4) * 0.07 + 's';
      setTimeout(() => el.classList.add('in'), 10);
    });
  });
}

function updateStats() {
  document.getElementById('totalCount').textContent    = CERTIFICATES.length;
  document.getElementById('sbCount').textContent       = CERTIFICATES.filter(c => c.category === 'springboard').length;
  document.getElementById('courseraCount').textContent = CERTIFICATES.filter(c => c.category === 'coursera').length;
  document.getElementById('googleCount').textContent   = CERTIFICATES.filter(c => c.category === 'google').length;
  document.getElementById('hackCount').textContent     = CERTIFICATES.filter(c => c.category === 'hackathon').length;
}

document.getElementById('filterTabs').addEventListener('click', e => {
  const btn = e.target.closest('.ftab');
  if (!btn) return;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

searchInput.addEventListener('input', e => {
  activeSearch = e.target.value.trim();
  render();
});

/* ════════════════════════════════════════════════════════
   LIGHTBOX
════════════════════════════════════════════════════════ */
const lightbox   = document.getElementById('lightbox');
const lbBody     = document.getElementById('lbBody');
const lbIssuer   = document.getElementById('lbIssuer');
const lbTitle    = document.getElementById('lbTitle');
const lbDownload = document.getElementById('lbDownload');
const lbVerify   = document.getElementById('lbVerify');
const lbCounter  = document.getElementById('lbCounter');
const lbPrev     = document.getElementById('lbPrev');
const lbNext     = document.getElementById('lbNext');
const lbClose    = document.getElementById('lbClose');

function openLightbox(globalIdx) {
  const pos = visibleCerts.findIndex(c => CERTIFICATES.indexOf(c) === globalIdx);
  lbIndex = pos >= 0 ? pos : 0;
  showLb();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLb() {
  const cert = visibleCerts[lbIndex];
  if (!cert) return;
  lbIssuer.textContent   = cert.issuer;
  lbTitle.textContent    = cert.name;
  lbDownload.href        = cert.file;
  lbCounter.textContent  = `${lbIndex + 1} / ${visibleCerts.length}`;
  lbPrev.disabled        = lbIndex === 0;
  lbNext.disabled        = lbIndex === visibleCerts.length - 1;

  if (cert.verify) {
    lbVerify.href = cert.verify;
    lbVerify.style.display = 'flex';
  } else {
    lbVerify.style.display = 'none';
  }

  if (cert.type === 'pdf') {
    lbBody.innerHTML = `<iframe class="lb-pdf" src="${cert.file}" title="${cert.name}"></iframe>`;
  } else {
    lbBody.innerHTML = `<img src="${cert.file}" alt="${cert.name}"
      onerror="this.outerHTML='<div style=\\'text-align:center;padding:40px;color:var(--text2)\\'><div style=\\'font-size:4rem;margin-bottom:16px\\'>${cert.emoji}</div><p>Image not found.<br/>Add it to <code>assets/certificates/</code></p></div>'" />`;
  }
}

function closeLb() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => lbBody.innerHTML = '', 300);
}

lbClose.addEventListener('click', closeLb);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; showLb(); } });
lbNext.addEventListener('click', () => { if (lbIndex < visibleCerts.length - 1) { lbIndex++; showLb(); } });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft'  && lbIndex > 0)                     { lbIndex--; showLb(); }
  if (e.key === 'ArrowRight' && lbIndex < visibleCerts.length - 1) { lbIndex++; showLb(); }
});

/* ════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════ */
updateStats();

const urlFilter = new URLSearchParams(window.location.search).get('filter');
const validFilters = ['springboard','coursera','google','hackathon','event','competition'];
if (urlFilter && validFilters.includes(urlFilter)) {
  activeFilter = urlFilter;
  document.querySelectorAll('.ftab').forEach(t => {
    t.classList.toggle('active', t.dataset.filter === urlFilter);
  });
}

render();
</script>
